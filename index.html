<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pen Fight Mobile</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #111;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }
        #game-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        /* Strictly enforce canvas sizing to parent container */
        #game-container canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .panel {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            pointer-events: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 400px;
        }
        h1, h2 { margin-top: 0; color: #222; }
        .pen-option {
            background: #ecf0f1;
            border: 2px solid #bdc3c7;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .pen-option:active { background: #d5dbdb; }
        .desc { font-size: 0.85em; color: #555; font-weight: normal; margin-top: 5px; }
        
        #hud {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 1.5em;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 10;
        }
        #turn-indicator {
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 20px;
            border-radius: 20px;
            display: inline-block;
        }
    </style>
</head>
<body>

<div id="game-container"></div>

<div id="hud" style="display: none;">
    <div id="turn-indicator">Player 1's Turn</div>
</div>

<div id="ui-layer">
    <div id="menu" class="panel">
        <h1 id="menu-title">Player 1</h1>
        <h2>Select Your Pen</h2>
        
        <div class="pen-option" onclick="selectPen('classic')">
            Classic Pen
            <div class="desc">Standard rectangle. Balanced slide and spin.</div>
        </div>
        <div class="pen-option" onclick="selectPen('thick')">
            Thick Middle
            <div class="desc">Bulky center. Spins rapidly, resists linear sliding.</div>
        </div>
        <div class="pen-option" onclick="selectPen('clip')">
            The Clipper
            <div class="desc">Asymmetrical weight. Unpredictable side spin.</div>
        </div>
    </div>
    
    <div id="game-over" class="panel" style="display: none;">
        <h1 id="winner-text">Player 1 Wins!</h1>
        <div class="pen-option" onclick="resetGame()">Play Again</div>
    </div>
</div>

<script>
    // Delay initialization to ensure mobile DOM viewports are fully calculated
    window.addEventListener('load', () => {
        setTimeout(initGame, 100);
    });

    const Engine = Matter.Engine,
          Render = Matter.Render,
          Runner = Matter.Runner,
          Bodies = Matter.Bodies,
          Body = Matter.Body,
          Composite = Matter.Composite,
          Events = Matter.Events;

    let engine, render, runner;
    let player1PenType = null, player2PenType = null;
    let p1Body, p2Body;
    let currentPlayer = 1;
    let gameState = 'MENU'; 
    
    const FRICTION = 0.1;
    const AIR_FRICTION = 0.02; 
    const RESTITUTION = 0.6;   
    const PEN_DENSITY = 0.005;

    let width, height, benchWidth, benchHeight, benchX, benchY;
    let touchStartPos = null, touchCurrentPos = null;

    function initGame() {
        const container = document.getElementById('game-container');
        
        width = container.clientWidth || window.innerWidth;
        height = container.clientHeight || window.innerHeight;
        
        benchWidth = width * 0.9;
        benchHeight = height * 0.8;
        benchX = width / 2;
        benchY = height / 2;

        engine = Engine.create();
        // Fully disable gravity for top-down table view
        engine.gravity.x = 0;
        engine.gravity.y = 0;
        engine.gravity.scale = 0;

        render = Render.create({
            element: container,
            engine: engine,
            options: {
                width: width,
                height: height,
                wireframes: false,
                background: '#2c3e50', // Solid background color prevents mobile transparency bugs
                pixelRatio: window.devicePixelRatio || 1 // Enforce crisp rendering
            }
        });

        const bench = Bodies.rectangle(benchX, benchY, benchWidth, benchHeight, {
            isStatic: true,
            isSensor: true, 
            render: { fillStyle: '#8e44ad' } 
        });
        Composite.add(engine.world, bench);

        Render.run(render);
        runner = Runner.create();
        Runner.run(runner, engine);

        setupTouchEvents();
        setupGameLoop();
    }

    function createPen(type, x, y, color) {
        let parts = [];
        const baseOptions = {
            friction: FRICTION,
            frictionAir: AIR_FRICTION,
            restitution: RESTITUTION,
            density: PEN_DENSITY,
            render: { fillStyle: color }
        };

        if (type === 'classic') {
            parts.push(Bodies.rectangle(x, y, 20, 120, baseOptions));
        } 
        else if (type === 'thick') {
            parts.push(Bodies.rectangle(x, y - 40, 15, 40, baseOptions)); 
            parts.push(Bodies.rectangle(x, y + 40, 15, 40, baseOptions)); 
            parts.push(Bodies.rectangle(x, y, 35, 60, baseOptions));      
        } 
        else if (type === 'clip') {
            parts.push(Bodies.rectangle(x, y, 20, 120, baseOptions));
            parts.push(Bodies.rectangle(x + 15, y - 30, 10, 40, baseOptions)); 
        }

        const pen = Body.create({
            parts: parts,
            friction: FRICTION,
            frictionAir: AIR_FRICTION,
            restitution: RESTITUTION,
            render: { fillStyle: color } 
        });
        
        // Force explicit placement to prevent Matter.js from offsetting compound parts
        Body.setPosition(pen, { x: x, y: y });
        
        return pen;
    }

    // Attach to window object for inline HTML triggers
    window.selectPen = function(type) {
        if (!player1PenType) {
            player1PenType = type;
            document.getElementById('menu-title').innerText = "Player 2";
        } else {
            player2PenType = type;
            document.getElementById('menu').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            startGame();
        }
    };

    function startGame() {
        p1Body = createPen(player1PenType, benchX, benchY + benchHeight/3, '#e74c3c'); 
        p2Body = createPen(player2PenType, benchX, benchY - benchHeight/3, '#3498db'); 

        Composite.add(engine.world, [p1Body, p2Body]);
        currentPlayer = 1;
        gameState = 'AIMING';
        updateTurnUI();
    }

    function setupTouchEvents() {
        const canvas = render.canvas;

        canvas.addEventListener('touchstart', (e) => {
            if (gameState !== 'AIMING') return;
            const touch = e.touches[0];
            touchStartPos = { x: touch.clientX, y: touch.clientY };
            touchCurrentPos = { ...touchStartPos };
        });

        canvas.addEventListener('touchmove', (e) => {
            if (gameState !== 'AIMING' || !touchStartPos) return;
            const touch = e.touches[0];
            touchCurrentPos = { x: touch.clientX, y: touch.clientY };
        });

        canvas.addEventListener('touchend', (e) => {
            if (gameState !== 'AIMING' || !touchStartPos) return;
            
            const forceX = (touchStartPos.x - touchCurrentPos.x) * 0.0003;
            const forceY = (touchStartPos.y - touchCurrentPos.y) * 0.0003;
            
            if (Math.abs(forceX) > 0.002 || Math.abs(forceY) > 0.002) {
                const activeBody = (currentPlayer === 1) ? p1Body : p2Body;
                Body.applyForce(activeBody, activeBody.position, { x: forceX, y: forceY });
                
                const spinForce = (Math.random() - 0.5) * 0.05;
                Body.setAngularVelocity(activeBody, spinForce);

                gameState = 'MOVING';
            }
            touchStartPos = null;
        });
    }

    Events.on(render, 'afterRender', function() {
        if (gameState === 'AIMING' && touchStartPos && touchCurrentPos) {
            const ctx = render.context;
            const activeBody = (currentPlayer === 1) ? p1Body : p2Body;

            ctx.beginPath();
            ctx.moveTo(activeBody.position.x, activeBody.position.y);
            
            const dx = touchStartPos.x - touchCurrentPos.x;
            const dy = touchStartPos.y - touchCurrentPos.y;
            
            ctx.lineTo(activeBody.position.x + dx * 2, activeBody.position.y + dy * 2);
            ctx.strokeStyle = (currentPlayer === 1) ? '#ffbaba' : '#baddff';
            ctx.lineWidth = 4;
            ctx.setLineDash([10, 10]);
            ctx.stroke();
            ctx.setLineDash([]);
        }
    });

    function setupGameLoop() {
        Events.on(engine, 'beforeUpdate', function() {
            if (gameState === 'MENU' || gameState === 'GAMEOVER') return;

            const p1Out = isOutOfBounds(p1Body);
            const p2Out = isOutOfBounds(p2Body);

            if (p1Out || p2Out) {
                gameState = 'GAMEOVER';
                if (p1Out && p2Out) showWinScreen("It's a Draw!");
                else if (p1Out) showWinScreen("Player 2 Wins!");
                else if (p2Out) showWinScreen("Player 1 Wins!");
                return;
            }

            if (gameState === 'MOVING') {
                const p1Stopped = p1Body.speed < 0.1 && Math.abs(p1Body.angularVelocity) < 0.02;
                const p2Stopped = p2Body.speed < 0.1 && Math.abs(p2Body.angularVelocity) < 0.02;

                if (p1Stopped && p2Stopped) {
                    Body.setVelocity(p1Body, { x: 0, y: 0 });
                    Body.setAngularVelocity(p1Body, 0);
                    Body.setVelocity(p2Body, { x: 0, y: 0 });
                    Body.setAngularVelocity(p2Body, 0);

                    currentPlayer = currentPlayer === 1 ? 2 : 1;
                    gameState = 'AIMING';
                    updateTurnUI();
                }
            }
        });
    }

    function isOutOfBounds(body) {
        if (!body) return false;
        const left = benchX - benchWidth / 2;
        const right = benchX + benchWidth / 2;
        const top = benchY - benchHeight / 2;
        const bottom = benchY + benchHeight / 2;

        return (body.position.x < left || body.position.x > right || 
                body.position.y < top || body.position.y > bottom);
    }

    function updateTurnUI() {
        const indicator = document.getElementById('turn-indicator');
        indicator.innerText = `Player ${currentPlayer}'s Turn`;
        indicator.style.color = currentPlayer === 1 ? '#e74c3c' : '#3498db';
    }

    window.showWinScreen = function(text) {
        document.getElementById('hud').style.display = 'none';
        document.getElementById('winner-text').innerText = text;
        document.getElementById('game-over').style.display = 'block';
    }

    window.resetGame = function() {
        Composite.clear(engine.world);
        Engine.clear(engine);
        
        const bench = Bodies.rectangle(benchX, benchY, benchWidth, benchHeight, {
            isStatic: true,
            isSensor: true,
            render: { fillStyle: '#8e44ad' }
        });
        Composite.add(engine.world, bench);

        player1PenType = null;
        player2PenType = null;
        document.getElementById('menu-title').innerText = "Player 1";
        document.getElementById('game-over').style.display = 'none';
        document.getElementById('menu').style.display = 'block';
        gameState = 'MENU';
    }
</script>
</body>
</html>
